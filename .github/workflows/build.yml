name: Build AIBot APK - ARMv7a 32bit Android 11+

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;33.0.2"

      - name: Install NDK
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Build Normal APK (ARMv7a)
        run: gradle assembleDebug --stacktrace -Pabi=armeabi-v7a

      - name: Rename to Normal APK
        run: |
          mkdir -p out/
          cp app/build/outputs/apk/debug/*.apk out/AIBot-armv7a-Android11.apk
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIBot-armv7a-32
          path: out/AIBot-armv7a-Android11.apk
          retention-days: 30
