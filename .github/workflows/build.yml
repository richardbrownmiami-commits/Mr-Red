name: Build Android APK - ARMv7a 32-bit Android 11+

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install exact Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             'platform-tools'             'platforms;android-34'             'build-tools;34.0.0'             'ndk;25.2.9519653'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Bundle tiny semantic embedding model
        shell: bash
        run: |
          set -euo pipefail
          base="https://huggingface.co/blobbybob/potion-mxbai-micro/resolve/d93b2e520cc717b5c21342c7194360ff89c76e95"
          dir="app/src/main/assets/embedded_semantic_model"
          mkdir -p "$dir"
          curl --fail --location --retry 3 -A "Mr-Red/1.0" "$base/model.safetensors?download=true" -o "$dir/model.safetensors"
          curl --fail --location --retry 3 -A "Mr-Red/1.0" "$base/tokenizer.json?download=true" -o "$dir/tokenizer.json"
          curl --fail --location --retry 3 -A "Mr-Red/1.0" "$base/config.json?download=true" -o "$dir/config.json"
          printf '%s\n' 'blobbybob/potion-mxbai-micro' > "$dir/MODEL_ID.txt"
          printf '%s\n' 'Apache-2.0' > "$dir/LICENSE.txt"
          test "$(wc -c < "$dir/model.safetensors")" -gt 700000
          test "$(wc -c < "$dir/model.safetensors")" -lt 1000000
          sha256sum "$dir/model.safetensors"
          du -h "$dir"/*

      - name: Bundle quantized ONNX semantic model
        shell: bash
        run: |
          set -euo pipefail
          dir="app/src/main/assets/embedded_onnx"
          mkdir -p "$dir"
          base="https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/751bff37182d3f1213fa05d7196b954e230abad9"
          curl --fail --location --retry 3 -A "Mr-Red/1.0" "$base/onnx/model_quantized.onnx?download=true" -o "$dir/minilm.onnx"
          curl --fail --location --retry 3 -A "Mr-Red/1.0" "$base/vocab.txt?download=true" -o "$dir/vocab.txt"
          printf '%s\n' 'Xenova/all-MiniLM-L6-v2' > "$dir/MODEL_ID.txt"
          printf '%s\n' 'Apache-2.0' > "$dir/LICENSE.txt"
          test "$(wc -c < "$dir/minilm.onnx")" -gt 18000000
          test "$(wc -c < "$dir/minilm.onnx")" -lt 30000000
          sha256sum "$dir/minilm.onnx"
          du -h "$dir"/*
      - name: Pretrain custom neural network on CI runner
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/pretrainer app/src/main/assets/pretrained
          mkdir -p build/pretrainer app/src/main/assets/pretrained
          javac -d build/pretrainer             app/src/main/java/com/aibot/NeuralNetwork.java             app/src/main/java/com/aibot/Tokenizer.java             app/src/main/java/com/aibot/FullBackpropTrainer.java             tools/HostPretrainer.java
          java -cp build/pretrainer com.aibot.HostPretrainer             build/pretrained             app/src/main/res/raw/core_assistant.jsonl 
          cp build/pretrained/model.bin app/src/main/assets/pretrained/model.bin
          cp build/pretrained/vocab.txt app/src/main/assets/pretrained/vocab.txt
          cp build/pretrained/TRAINED.txt app/src/main/assets/pretrained/TRAINED.txt
          test -s app/src/main/assets/pretrained/model.bin
          test -s app/src/main/assets/pretrained/vocab.txt
          echo "Packaged pretrained model:"
          ls -lh app/src/main/assets/pretrained/
          cat app/src/main/assets/pretrained/TRAINED.txt

      - name: Build normal ARMv7a APK
        run: gradle --no-daemon --stacktrace clean assembleNormal

      - name: Verify APK is ARMv7a 32-bit only
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/normal -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          echo "Built: $apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | tee /tmp/badging.txt
          grep -q 'native-code.*armeabi-v7a' /tmp/badging.txt
          if grep -Eq 'arm64-v8a|x86_64|x86' /tmp/badging.txt; then
            echo "ERROR: APK contains a non-ARMv7a ABI"
            exit 1
          fi

      - name: Publish normal APK
        uses: actions/upload-artifact@v4
        with:
          name: AIBot-armv7a-32-bit-Android11-normal
          path: app/build/outputs/apk/normal/*.apk
          if-no-files-found: error
          retention-days: 30
