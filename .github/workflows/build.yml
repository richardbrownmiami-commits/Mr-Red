name: Build Android APK - ARMv7a 32-bit

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-33' \
            'build-tools;33.0.2' \
            'ndk;25.2.9519653' \
            'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build ARMv7a debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK ABI
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          echo "Built: $apk"
          "$ANDROID_HOME/build-tools/33.0.2/aapt" dump badging "$apk" | grep -q "native-code.*armeabi-v7a"

      - name: Publish ARMv7a APK
        uses: actions/upload-artifact@v4
        with:
          name: AIBot-armv7a-32-bit
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30