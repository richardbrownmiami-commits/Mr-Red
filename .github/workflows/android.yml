name: Build Mr-Red Android APK

on:
  push:
    branches: [ main, 'integration/opendroid-armv7-api30', 'integration/opendroid-agent-loop', 'feature/new-local-llama-tool-agent' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
      - name: Install Android SDK platform, build tools, and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Audit and prepare source
        run: python3 tools/prepare_build.py
      - name: Run unit tests and compile instrumentation tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin --stacktrace
      - name: Build release APK with llama.cpp
        run: |
          gradle --no-daemon :app:assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Mr-Red.apk
      - name: Verify APK and ARMv7 native library
        run: |
          APK="app/build/outputs/apk/release/Mr-Red.apk"
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/libmrred_llm.so'
          echo "APK integrity and ARMv7 llama JNI library verified."
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-Red-release
          path: app/build/outputs/apk/release/Mr-Red.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mr-Red APK build ${{ github.run_number }}
          files: app/build/outputs/apk/release/Mr-Red.apk
          make_latest: true
