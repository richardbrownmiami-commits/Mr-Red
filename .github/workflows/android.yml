name: Build Redmi 9 Offline AI

on:
  push:
    branches: [ main, 'integration/opendroid-armv7-api30' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 20
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-30" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;3.31.6"; then
              break
            fi
            echo "Android SDK package install attempt ${attempt} failed; clearing partial NDK download and retrying."
            rm -rf "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" "$ANDROID_SDK_ROOT/temp"
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          test -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Audit and prepare source
        run: python3 tools/prepare_build.py
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify native libraries before packaging
        run: |
          set -e
          FOUND=0
          while IFS= read -r -d '' f; do
            FOUND=1
            file "$f"
            if file "$f" | grep -Eq 'ELF 64-bit|aarch64|x86-64'; then
              echo "FAIL: 64-bit native library detected: $f"
              exit 1
            fi
          done < <(find app/build -type f -name '*.so' -print0)
          if [ "$FOUND" -eq 0 ]; then echo "FAIL: no native .so files found"; exit 1; fi
          echo "Native library audit passed: no 64-bit ELF libraries found."
      - name: Verify release APK ABI
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'lib/.*/.*\.so$' || true
          if unzip -l "$APK" | grep -E 'lib/(arm64-v8a|x86|x86_64)/'; then exit 1; fi
          if ! unzip -l "$APK" | grep -E 'lib/armeabi-v7a/.*\.so$'; then exit 1; fi
          echo "ABI verification passed: armeabi-v7a only."
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mekamaru-release-armeabi-v7a
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
