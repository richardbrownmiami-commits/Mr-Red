plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aibot'
    // AndroidX 1.6.1 and Material 1.9.0 require a newer compile SDK than 30.
    compileSdk 33

    defaultConfig {
        applicationId "com.aibot"
        minSdk 29   // ONNX Runtime requires API 29 minimum (was 19 - unsafe with ONNX dependency)
        targetSdk 30 // Android 11 - avoids stricter API 31+ storage rules
        versionCode 1
        versionName "1.0"

        // ARMv7a 32bit ONLY
        ndk {
            abiFilters "armeabi-v7a"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Split APK per ABI - keeps APK small for ARMv7a
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a"
            universalApk false
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        // Keep only ARMv7a native libs
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
        pickFirst 'lib/armeabi-v7a/*.so'
        exclude 'lib/arm64-v8a/**'
        exclude 'lib/x86/**'
        exclude 'lib/x86_64/**'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Networking - OkHttp (works on ARMv7a)
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'

    // HTML Parsing - Jsoup (pure Java, works on ARMv7a)
    implementation 'org.jsoup:jsoup:1.16.1'

    // JSON Parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // File handling
    implementation 'commons-io:commons-io:2.11.0'

    // CSV parsing for datasets
    implementation 'com.opencsv:opencsv:5.7.1'

    // Progress bar for training
    implementation 'androidx.core:core:1.10.1'

    // Storage & Preferences
    implementation 'androidx.preference:preference:1.2.1'

    // Coroutines alternative - RxJava2 (lighter for ARMv7a)
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
