// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
    }
}

// Dependency repositories are configured centrally in settings.gradle.
// Do not declare project repositories here because settings.gradle uses
// RepositoriesMode.FAIL_ON_PROJECT_REPOS.

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}